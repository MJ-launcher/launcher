/* ================= tokens ================= */
:root {
  --font-sans: "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mc: "Minecraft", "Noto Sans", monospace;
  --mc-bg: #171615;
  --mc-bg-elev: #201f1d;
  --mc-side: #312d2c;
  --mc-side-row: #3d3a37;
  --mc-side-row-hover: #46433f;
  --mc-side-row-active: #4e4c49;
  --mc-side-divider: #262422;
  --mc-bar: #ecebeb;
  --mc-text: #e0e5e2;
  --mc-text-dim: #bbb4b1;
  --mc-text-faint: #8c8987;
  --mc-green: #4c8c39;
  --mc-green-face: #478134;
  --mc-green-dark: #2e5c1e;
  --mc-green-bright: #55b04a;
  --mc-input: #2a2827;
  --mc-input-idle: #454340;
  --mc-stone: #c1b7b3;
  --mc-stone-dark: #8a8886;
  --mc-warn: #e08030;
}

/* ================= reset / base ================= */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
img { display: block; border: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: not-allowed; }
input { font: inherit; border: 0; outline: none; background: none; color: inherit; }
html, body { height: 100%; }
html { line-height: 1.5; }
body {
  font-family: var(--font-sans);
  background: #171615;
  color: #e0e5e2;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ================= Minecraft design tokens (from globals.css) ================= */
.mc-shadow { text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.45); }
.mc-shadow-dark { text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.35); }

.mc-btn-green {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: linear-gradient(180deg, #5fae4d 0%, #4f9a3d 45%, #3f7a30 100%);
  border: 2px solid #1d3a14;
  border-bottom-width: 4px;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.25);
  color: #fff;
  cursor: pointer;
  user-select: none;
  transition: filter 120ms ease, transform 60ms ease;
}
.mc-btn-green:hover { filter: brightness(1.12); }
.mc-btn-green:active { transform: translateY(1px); border-bottom-width: 2px; }
.mc-btn-green:disabled { filter: saturate(0.35) brightness(0.75); cursor: not-allowed; }

.mc-btn-stone {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: linear-gradient(180deg, #cdc5c1 0%, #c1b7b3 45%, #a99f9b 100%);
  border: 2px solid #56504d;
  border-bottom-width: 4px;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35);
  color: #1a1918;
  cursor: pointer;
  user-select: none;
  transition: filter 120ms ease, transform 60ms ease;
}
.mc-btn-stone:hover { filter: brightness(1.05); }
.mc-btn-stone:active { transform: translateY(1px); border-bottom-width: 2px; }

.mc-scroll { scrollbar-width: thin; scrollbar-color: #57534f transparent; }
.mc-scroll::-webkit-scrollbar { width: 10px; }
.mc-scroll::-webkit-scrollbar-track { background: transparent; }
.mc-scroll::-webkit-scrollbar-thumb { background: #4a4744; border: 2px solid #262524; }
.mc-scroll::-webkit-scrollbar-thumb:hover { background: #5a5754; }

.mc-pixel { image-rendering: pixelated; }

/* ================= app shell ================= */
#app { display: flex; height: 100vh; width: 100%; overflow: hidden; background: #171615; }
.main-col { display: flex; flex-direction: column; flex: 1 1 0%; min-width: 0; }
.main { flex: 1 1 0%; min-height: 0; overflow-y: auto; }

/* ================= sidebar ================= */
.sidebar {
  display: flex;
  flex-direction: column;
  width: 216px;
  flex-shrink: 0;
  border-right: 1px solid #262422;
  background: #312d2c;
}
.side-account {
  position: relative;
  display: flex;
  height: 76px;
  width: 100%;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #262422;
  background: #3a3734;
  padding: 0 16px;
  text-align: left;
  transition: background-color 150ms ease;
}
.side-account:hover { background: #443f3b; }
.side-account img { height: 34px; width: 34px; flex-shrink: 0; border-radius: 3px; object-fit: contain; }
.side-account .sa-text { min-width: 0; flex: 1 1 0%; }
.side-account .sa-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 700; line-height: 1.25; color: #e0e5e2; }
.side-account .sa-sub { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; line-height: 1.25; color: #9a9a9a; }
.side-account .sa-chev { flex-shrink: 0; color: #bbb4b1; }
.side-nav { flex: 1 1 0%; overflow-y: auto; }
.side-btn {
  position: relative;
  display: flex;
  width: 100%;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #262422;
  padding: 15px 16px;
  text-align: left;
  background: #3d3a37;
  transition: background-color 150ms ease;
}
.side-btn:hover { background: #46433f; }
.side-btn:active { background: #4e4c49; }
.side-btn.active { background: #4e4c49; }
.side-btn.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #ecebeb; }
.side-btn img { height: 28px; width: 28px; flex-shrink: 0; object-fit: contain; }
.side-btn .sb-lines { min-width: 0; font-size: 12px; font-weight: 700; text-transform: uppercase; line-height: 1.3; letter-spacing: 0.02em; color: #e0e5e2; }
.side-btn .sb-lines span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-bottom { border-top: 1px solid #262422; }
.side-version { padding: 4px 16px 12px; font-size: 10px; color: #8c8987; }
.side-close { position: absolute; right: 12px; top: 12px; color: #bbb4b1; display: none; padding: 4px; }
.side-close:hover { color: #fff; }

.mobile-overlay { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, 0.6); display: none; }
.mobile-overlay.show { display: block; }
.hamburger { display: none; border-radius: 4px; padding: 4px; color: #bbb4b1; }
.hamburger:hover { background: #2a2827; color: #fff; }

@media (max-width: 1023.98px) {
  .sidebar { position: fixed; top: 0; bottom: 0; left: 0; z-index: 50; transform: translateX(-100%); transition: transform 150ms ease; }
  .sidebar.mobile-open { transform: translateX(0); }
  .side-close { display: inline-flex; }
  .hamburger { display: inline-flex; }
}

/* ================= top tabs / game header ================= */
.top-tabs { flex-shrink: 0; border-bottom: 1px solid #2a2827; background: #201f1d; }
.top-tabs-row { display: flex; align-items: center; gap: 12px; padding: 12px 24px 0; }
@media (min-width: 1024px) { .top-tabs-row { padding-left: 32px; padding-right: 32px; } }
.top-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #d8dbd7; }
.top-nav { margin-top: 4px; display: flex; align-items: center; gap: 16px; overflow-x: auto; white-space: nowrap; padding: 0 16px; }
@media (min-width: 640px) { .top-nav { gap: 28px; padding-left: 24px; } }
@media (min-width: 1024px) { .top-nav { padding-left: 32px; padding-right: 32px; } }
.tab-btn { position: relative; flex-shrink: 0; padding: 4px 0 11px; font-size: 13px; font-weight: 400; color: #bbb4b1; transition: color 150ms ease; }
@media (min-width: 640px) { .tab-btn { font-size: 17px; } }
.tab-btn:hover { color: #e0e5e2; }
.tab-btn.active { font-weight: 700; color: #e0e5e2; }
.tab-btn.active::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #3c8527; }

.launch-after .la-txt { font-size: 14px; color: #f0f0f0; }
.modal-cancel { height: 36px; width: 96px; font-size: 14px; font-weight: 700; }
.modal-install { height: 36px; width: 104px; font-size: 14px; font-weight: 700; }

/* ================= username dialog ================= */
.username-modal { background: rgba(0, 0, 0, 0.6); align-items: center; justify-content: center; z-index: 70; }
.username-modal .um-card { width: 380px; max-width: calc(100vw - 48px); background: #262524; border: 2px solid #454340; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.55); padding: 24px 24px 20px; }
.username-modal .um-card h2 { font-size: 18px; font-weight: 700; color: #f0f0f0; margin-bottom: 16px; text-align: center; }
.username-modal .um-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

/* ================= toasts ================= */
.toast-viewport { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; flex-direction: column-reverse; max-height: 100vh; padding: 16px; pointer-events: none; }
@media (min-width: 640px) { .toast-viewport { top: auto; bottom: 0; left: auto; right: 0; width: auto; flex-direction: column; } }
@media (min-width: 768px) { .toast-viewport { max-width: 420px; } }
.toast {
  position: relative;
  pointer-events: auto;
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  overflow: hidden;
  border: 1px solid #2a2827;
  background: #171615;
  color: #e0e5e2;
  padding: 16px;
  padding-right: 24px;
  box-shadow: 0 10px 15px -3px rgba(0,0,0,0.35), 0 4px 6px -4px rgba(0,0,0,0.35);
  animation: toast-in 250ms ease;
}
.toast-body { min-width: 0; }
.toast-title { font-size: 14px; font-weight: 600; color: #e0e5e2; }
.toast-desc { font-size: 14px; opacity: 0.9; margin-top: 2px; }
.toast-close { position: absolute; right: 4px; top: 4px; padding: 4px; color: rgba(224,229,226,0.5); opacity: 0; transition: opacity 150ms ease, color 150ms ease; }
.toast:hover .toast-close { opacity: 1; }
.toast-close:hover { color: #e0e5e2; }
.toast.toast-out { animation: toast-out 200ms ease forwards; }
@keyframes toast-in { from { transform: translateY(100%); opacity: 0.6; } to { transform: none; opacity: 1; } }
@keyframes toast-out { to { transform: translateX(110%); opacity: 0; } }
</style>

const $ = (sel, root) => (root || document).querySelector(sel);

function el(tag, cls, html) { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ================= toasts ================= */
function toast(title, description) {
  const vp = $('#toastViewport');
  vp.innerHTML = '';
  const t = el('div', 'toast');
  const body = el('div', 'toast-body');
  const tt = el('div', 'toast-title'); tt.textContent = title;
  body.appendChild(tt);
  if (description) { const td = el('div', 'toast-desc'); td.textContent = description; body.appendChild(td); }
  const close = el('button', 'toast-close'); close.setAttribute('aria-label', 'Close'); close.innerHTML = ic('x', 16);
  t.appendChild(body); t.appendChild(close);
  vp.appendChild(t);
  let gone = false;
  const remove = () => { if (gone) return; gone = true; t.classList.add('toast-out'); setTimeout(() => t.remove(), 220); };
  close.addEventListener('click', remove);
  setTimeout(remove, 5000);
}

/* ================= state (zustand-persist compatible) ================= */
const LS_KEY = 'minecraft-launcher-state';
const LS_VERSION = 1;
let state = {
  installations: defaultInstallations(),
  selectedId: 'inst-latest-release',
  activeTab: 'play',
  activeGame: 'java',
  username: 'Player',
};
function loadState() {
  let storedVersion = 0;
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const s = parsed && parsed.state;
      if (s && typeof s === 'object') {
        if (Array.isArray(s.installations)) state.installations = s.installations;
        if (typeof s.selectedId === 'string') state.selectedId = s.selectedId;
        if (typeof s.activeTab === 'string') state.activeTab = s.activeTab;
        if (typeof s.activeGame === 'string') state.activeGame = s.activeGame;
        if (typeof s.username === 'string' && s.username.trim()) state.username = s.username.trim();
      }
      if (parsed && typeof parsed.version === 'number') storedVersion = parsed.version;
    }
  } catch (e) { /* storage unavailable */ }
  // migrate v0 -> v1: drop the old pre-added defaults (release 26.2 / release 1.20.6), keep player-created ones
  if (storedVersion < 1) {
    state.installations = state.installations.filter(i => i && i.id !== 'inst-release-26-2' && i.id !== 'inst-release-1-20-6');
  }
  // validate
  const validIcons = INSTALL_ICONS.map(i => i.id);
  if (!Array.isArray(state.installations)) state.installations = [];
  state.installations = state.installations.filter(i =>
    i && typeof i.name === 'string' && VERSIONS.some(v => v.id === i.versionId) && validIcons.includes(i.icon));
  if (!state.installations.length) state.installations = defaultInstallations();
  if (!state.installations.some(i => i.id === state.selectedId)) state.selectedId = state.installations[0].id;
  if (!TABS.some(t => t.id === state.activeTab)) state.activeTab = 'play';
  if (!GAME_STUBS[state.activeGame] && state.activeGame !== 'java') state.activeGame = 'java';
}
function persist() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      state: {
        installations: state.installations,
        selectedId: state.selectedId,
        activeTab: state.activeTab,
        activeGame: state.activeGame,
        username: state.username,
      },
      version: LS_VERSION,
    }));
  } catch (e) { /* storage unavailable */ }
}

/* ================= store actions ================= */
function selectedInstallation() { return state.installations.find(i => i.id === state.selectedId) || state.installations[0]; }
function select(id) { state.selectedId = id; persist(); renderVersionSelect(); }
function setTab(tab) { state.activeTab = tab; persist(); renderHeader(); renderMain(); }
function setGame(game) {
  state.activeGame = game;
  if (game !== 'java') state.activeTab = 'play';
  persist();
  renderSidebar(); renderHeader(); renderMain(); closeMobile();
}
function addInstallation(inst) {
  state.installations.push(inst);
  state.selectedId = inst.id;
  persist(); renderVersionSelect(); renderInstalls();
}
function deleteInstallation(id) {
  state.installations = state.installations.filter(i => i.id !== id);
  if (state.selectedId === id) state.selectedId = state.installations[0] ? state.installations[0].id : '';
  persist(); renderVersionSelect(); renderInstalls();
}
function duplicateInstallation(id) {
  const src = state.installations.find(i => i.id === id);
  if (!src) return;
  state.installations.push(Object.assign({}, src, {
    id: 'inst-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
    name: src.name + ' copy',
    createdAt: Date.now(),
    lastPlayed: undefined,
  }));
  persist(); renderInstalls();
}
function markPlayed(id) {
  state.installations = state.installations.map(i => i.id === id ? Object.assign({}, i, { lastPlayed: Date.now() }) : i);
  persist(); renderInstalls();
}
function launchInstallation(inst) {
  const v = getVersion(inst.versionId);
  const w = parseInt(inst.resolutionW ?? '', 10);
  const h = parseInt(inst.resolutionH ?? '', 10);
  const width = Number.isFinite(w) && w > 0 ? w : 1280;
  const height = Number.isFinite(h) && h > 0 ? h : 760;
  let win = null;
  try { win = window.open(v.html, '_blank', 'width=' + width + ',height=' + height); } catch (e) { win = null; }
  if (!win) { try { win = window.open(v.html, '_blank'); } catch (e) { /* blocked */ } }
  return win;
}

  const v = getVersion(inst.versionId);
  launchInstallation(inst);

/* ================= installations view ================= */
let instQuery = '';
let instSort = 'name';
let showReleases = true;
let showSnapshots = true;
let showModded = true;

function rowsForList() {
  let list = state.installations.slice();
  if (instQuery.trim()) {
    const q = instQuery.trim().toLowerCase();
    list = list.filter(i => i.name.toLowerCase().includes(q));
  }
  if (!showReleases) list = [];
  list.sort((a, b) => {
    if (instSort === 'name') return a.name.localeCompare(b.name);
    if (instSort === 'created') return b.createdAt - a.createdAt;
    return (b.lastPlayed ?? 0) - (a.lastPlayed ?? 0);
  });
  return list;
}

  };
  $('#launchAfterLabel').addEventListener('click', e => { e.preventDefault(); toggleLaunchAfter(); });
  $('#launchAfterBox').addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleLaunchAfter(); }
  });
}

/* ================= username dialog ================= */
function applyUsername() {
  const sa = $('#saName');
  if (sa) sa.textContent = state.username;
  const pc = $('#pcName');
  if (pc) pc.textContent = state.username;
}
function openUsernameModal() {
  $('#uName').value = state.username;
  $('#usernameModal').hidden = false;
  setTimeout(() => { const inp = $('#uName'); inp.focus(); inp.select(); }, 60);
}
function closeUsernameModal() { $('#usernameModal').hidden = true; }
function saveUsername() {
  const name = $('#uName').value.trim().slice(0, 24) || 'Player';
  state.username = name;
  persist();
  applyUsername();
  closeUsernameModal();
  toast('Username changed', 'Your new username is \u201C' + name + '\u201D.');
}
function wireUsernameModal() {
  $('#accountBtn').addEventListener('click', openUsernameModal);
  $('#uCancel').addEventListener('click', closeUsernameModal);
  $('#uSave').addEventListener('click', saveUsername);
  $('#uName').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); saveUsername(); }
  });
  $('#usernameModal').addEventListener('mousedown', e => {
    if (e.target === $('#usernameModal')) closeUsernameModal();
  });
}

/* ================= global listeners ================= */
document.addEventListener('mousedown', e => {
  $$('.drop.open').forEach(d => { if (!d.contains(e.target)) d.classList.remove('open'); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('#usernameModal').hidden) { closeUsernameModal(); return; }
    if (!$('#createModal').hidden) { closeModal(); return; }
    closeAllDrops();
  }
});

/* ================= boot ================= */
loadState();
renderSidebar();
renderHeader();
renderMain();
wireModal();
wireUsernameModal();
applyUsername();
$('#mobileOverlay').addEventListener('click', closeMobile);
$('#sideClose').addEventListener('click', closeMobile);
})();
</script>

(function () {
  if (!('serviceWorker' in navigator)) return;
  var ok = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!ok) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
})();
</script>
